openapi: 3.0.4
info:
  title: Slot Machine Simulator
  description: >-
    Slot Machine Simulator generates slot machine reel spins for configurable
    reels, bet sizes, and spin counts. Every run outputs symbol names and emoji
    for each reel; paid plans add payout calculations, win tracking, and net
    profit statistics.
  termsOfService: https://apiverve.com/terms/
  contact:
    name: APIVerve Support
    email: hello@apiverve.com
    url: https://apiverve.com/contact
  version: 1.0.0
externalDocs:
  description: Learn more about APIVerve
  url: https://docs.apiverve.com?utm_source=openapi
servers:
  - url: https://api.apiverve.com/
paths:
  /v1/slotmachine:
    get:
      summary: Slot Machine Simulator
      description: Simulate slot machine spins with configurable reels and bet amounts
      operationId: slotmachine
      parameters:
        - name: spins
          in: query
          schema:
            type: integer
          required: false
          description: Number of spins to simulate
          example: 5
        - name: reels
          in: query
          schema:
            type: integer
          required: false
          description: Number of reels
          example: 3
        - name: bet
          in: query
          schema:
            type: number
          required: false
          description: Bet amount per spin
          example: 1
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    description: status
                  error:
                    type: string
                    description: error
                  data:
                    type: object
                    description: data
              example:
                status: ok
                error: null
                data:
                  total_spins: 5
                  num_reels: 3
                  bet_per_spin: 1
                  spins:
                    - spin_number: 1
                      reels:
                        - symbol: 🍋
                          name: Lemon
                        - symbol: 🍒
                          name: Cherry
                        - symbol: 🍒
                          name: Cherry
                      bet: 1
                      payout: 0
                      win_type: none
                      is_win: false
                    - spin_number: 2
                      reels:
                        - symbol: ⭐
                          name: Star
                        - symbol: 🍋
                          name: Lemon
                        - symbol: ⭐
                          name: Star
                      bet: 1
                      payout: 0
                      win_type: none
                      is_win: false
                    - spin_number: 3
                      reels:
                        - symbol: 🍊
                          name: Orange
                        - symbol: 🍇
                          name: Grape
                        - symbol: 🍋
                          name: Lemon
                      bet: 1
                      payout: 0
                      win_type: none
                      is_win: false
                    - spin_number: 4
                      reels:
                        - symbol: 🍒
                          name: Cherry
                        - symbol: ⭐
                          name: Star
                        - symbol: 🔔
                          name: Bell
                      bet: 1
                      payout: 0
                      win_type: none
                      is_win: false
                    - spin_number: 5
                      reels:
                        - symbol: 🍒
                          name: Cherry
                        - symbol: 🍒
                          name: Cherry
                        - symbol: 7️⃣
                          name: Seven
                      bet: 1
                      payout: 0.5
                      win_type: small
                      is_win: true
                  total_bet: 5
                  total_winnings: 0.5
                  net_profit: -4.5
                  wins: 1
                  losses: 4
                  win_percentage: 20
                  available_symbols:
                    - symbol: 🍒
                      name: Cherry
                      payout_multiplier: 2
                    - symbol: 🍋
                      name: Lemon
                      payout_multiplier: 3
                    - symbol: 🍊
                      name: Orange
                      payout_multiplier: 5
                    - symbol: 🍇
                      name: Grape
                      payout_multiplier: 10
                    - symbol: 🔔
                      name: Bell
                      payout_multiplier: 20
                    - symbol: ⭐
                      name: Star
                      payout_multiplier: 50
                    - symbol: 💎
                      name: Diamond
                      payout_multiplier: 100
                    - symbol: 7️⃣
                      name: Seven
                      payout_multiplier: 200
        '401':
          description: Your request was not authorized, or your API Key was invalid
        '404':
          description: Requested resource was not found
        '500':
          description: A server error has occurred, try again later
components:
  securitySchemes:
    api_key:
      type: apiKey
      name: x-api-key
      in: header
security:
  - api_key: []
